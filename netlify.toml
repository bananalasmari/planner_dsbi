[build]
  publish = "."
  command = "echo ready"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.clickup]
  # Keep under Netlify's sync limit; sendPlan is optimized to finish sooner.
  timeout = 26

[functions.jira]
  timeout = 26

[[redirects]]
  from = "/api/clickup/*"
  to = "/.netlify/functions/clickup/:splat"
  status = 200

[[redirects]]
  from = "/api/jira/*"
  to = "/.netlify/functions/jira/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/frontend-plan-generator_24.html"
  status = 200
